name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Test PWA cache, installation and safe updates
        run: npm run test:pwa

      - name: Test ITO rules
        run: npm run test:ito

      - name: Test owner call moderation
        run: npm run test:moderation

      - name: Test Poker rules
        run: npm run test:poker

      - name: Test Truco turn order and raises
        run: npm run test:truco

      - name: Test Coup rules and private state
        run: npm run test:coup

      - name: Test Codenames rules and secret key
        run: npm run test:codenames

      - name: Test room music synchronization and playback
        run: npm run test:music

      - name: Test Gartic drawing replication
        run: npm run test:drawing

      - name: Test Gartic and Impostor rules, secrets and votes
        run: npm run test:party

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://meowhnfcagoebolimqhl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UEUoALzMExdSiWwFOOi2pw_WvIjcrfZ

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
          # Android verifies this public file at the exact .well-known URL.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
