name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer and portable app
        shell: pwsh
        run: |
          npm run desktop:dist:windows 2>&1 | Tee-Object -FilePath desktop-build.log
          $desktopExitCode = $LASTEXITCODE
          if ($desktopExitCode -ne 0) {
            $desktopError = (Get-Content desktop-build.log -Tail 40) -join "`n"
            $desktopError = $desktopError.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows desktop packaging failed::$desktopError"
            exit $desktopExitCode
          }
        env:
          VITE_SUPABASE_URL: https://meowhnfcagoebolimqhl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UEUoALzMExdSiWwFOOi2pw_WvIjcrfZ

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: Ford-Kall-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe release/latest.yml release/*.blockmap --generate-notes --title "Ford Kall $GITHUB_REF_NAME"
